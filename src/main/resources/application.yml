spring:
  application:
    name: parking-lot-navigator
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/parking_lot_navigator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
