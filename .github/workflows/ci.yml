name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgrouting/pgrouting:18-3.6-4.0.1
        env:
          POSTGRES_DB: parking_lot_navigator
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check
        run: ./gradlew spotlessCheck

      # 컴파일, 테스트, jar 패키징까지 수행
      # 테스트가 뜰 때 Spring Boot Flyway가 SQL/Java 마이그레이션을 버전 순서대로 실제 PostgreSQL에 적용하고 파일명 규칙도 검사한다.
      - name: Build
        run: ./gradlew build
